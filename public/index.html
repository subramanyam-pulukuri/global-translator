<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Translate text and generate secure random strings." />
    <meta name="keywords" content="translator, react, language translator, random string generator, rapidapi" />
    <meta name="author" content="Pulukuri Subramanyam" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/icons8-language-claude-hand-drawn-96.png" />
    <title>Global Translator</title>
    <script>
  (function () {
    const redirect = sessionStorage.redirect;

    delete sessionStorage.redirect;

    if (redirect && redirect !== location.pathname) {
      window.history.replaceState(null, null, redirect);
    }
  })();
  </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
